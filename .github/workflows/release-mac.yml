name: Release Sound Shelf for macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sound-shelf-mac-release
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_RELEASE_ENABLED == 'true'
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      - name: Create automatic version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          RELEASE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          npm version "${RELEASE_VERSION}" --no-git-tag-version
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Verify Apple signing secrets
        shell: bash
        run: |
          missing=0
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::GitHub Actions secret ${name} is required."
              missing=1
            fi
          done
          if [ "${missing}" -ne 0 ]; then
            exit 1
          fi

      - name: Build, sign, notarize, and publish
        run: npm run release:mac

      - name: Show released version
        run: echo "Published Sound Shelf v${{ steps.version.outputs.version }}"
