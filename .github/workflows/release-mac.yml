name: Release Sound Shelf for macOS

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sound-shelf-mac-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: macos-14
    env:
      GH_TOKEN: ${{ github.token }}
      CSC_LINK: ${{ secrets.CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check source
        run: npm run check

      # 모든 푸시가 그대로 배포되므로 깨진 코드가 나가지 않도록 테스트를 먼저 돌린다.
      - name: Run tests
        run: npm test

      - name: Create automatic version
        id: version
        shell: bash
        run: |
          BASE_VERSION="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
          RELEASE_VERSION="${BASE_VERSION}.${GITHUB_RUN_NUMBER}"
          npm version "${RELEASE_VERSION}" --no-git-tag-version
          echo "version=${RELEASE_VERSION}" >> "${GITHUB_OUTPUT}"

      # Apple 인증서가 없어도 배포는 계속한다. 서명 없는 빌드는 Gatekeeper 경고가
      # 뜨고 앱 내 자동 업데이트가 동작하지 않지만, 내려받아 설치할 수는 있다.
      - name: Decide signing mode
        id: signing
        shell: bash
        run: |
          missing=""
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!name}" ]; then
              missing="${missing} ${name}"
            fi
          done
          if [ -n "${missing}" ]; then
            echo "signed=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::Apple 서명 인증서가 없어 서명 없는 빌드로 진행합니다. 누락:${missing}"
          else
            echo "signed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Build, sign, notarize, and publish
        if: steps.signing.outputs.signed == 'true'
        run: npm run release:mac

      - name: Build and publish without signing
        if: steps.signing.outputs.signed != 'true'
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          APPLE_ID: ""
          APPLE_APP_SPECIFIC_PASSWORD: ""
          APPLE_TEAM_ID: ""
        run: npm run release:mac

      # 서명이 없으면 macOS가 첫 실행을 막는다. 받는 사람이 방법을 알 수 있도록
      # 릴리스 설명에 적어 둔다. 실패해도 이미 게시된 릴리스는 그대로 남는다.
      - name: Explain the Gatekeeper step in the release notes
        if: steps.signing.outputs.signed != 'true'
        continue-on-error: true
        shell: bash
        run: |
          {
            echo "### 설치 방법"
            echo ""
            echo "1. 아래 \`Sound-Shelf-*-universal.dmg\`를 내려받습니다."
            echo "2. DMG를 열고 \`Sound Shelf\`를 \`응용 프로그램\` 폴더로 드래그합니다."
            echo "3. **첫 실행은 더블클릭이 아니라 우클릭 → 열기 → 열기** 를 누릅니다."
            echo ""
            echo "3번이 필요한 이유는 이 빌드에 Apple 개발자 서명이 없기 때문입니다."
            echo "한 번만 하면 다음부터는 그냥 열립니다. 같은 이유로 앱 안의 자동"
            echo "업데이트는 동작하지 않으므로, 새 버전은 이 페이지에서 받아 다시"
            echo "설치해 주세요."
          } > release-notes.md
          gh release edit "v${{ steps.version.outputs.version }}" --notes-file release-notes.md

      - name: Show released version
        shell: bash
        run: |
          {
            echo "### Sound Shelf v${{ steps.version.outputs.version }} 배포됨"
            if [ "${{ steps.signing.outputs.signed }}" = "true" ]; then
              echo "서명·공증된 빌드입니다. 설치된 앱이 자동으로 업데이트됩니다."
            else
              echo "서명 없는 빌드입니다. 첫 실행 시 우클릭 → 열기가 필요하고, 자동 업데이트는 동작하지 않습니다."
            fi
            echo ""
            echo "https://github.com/${GITHUB_REPOSITORY}/releases/latest"
          } >> "${GITHUB_STEP_SUMMARY}"
