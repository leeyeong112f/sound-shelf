<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; media-src 'self' file:; style-src 'self'; script-src 'self'" />
    <title>Local Sound Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand"><span class="brand-mark">S</span><span>Sound Shelf</span></div>
        <nav>
          <button class="nav-item active" data-filter="all"><span>▦</span> 모든 사운드 <b id="allCount">0</b></button>
          <button class="nav-item" data-filter="favorites"><span>★</span> 즐겨찾기 <b id="favoriteCount">0</b></button>
        </nav>
        <div class="section-label">카테고리</div>
        <div id="categoryList" class="category-list"></div>
        <div class="sidebar-bottom">
          <button id="addFolderBtn" class="primary-button">＋ 폴더 추가</button>
          <button id="addFilesBtn" class="subtle-button">파일 추가</button>
        </div>
      </aside>

      <main class="main-pane">
        <header class="toolbar">
          <div class="search-wrap">
            <span>⌕</span>
            <input id="searchInput" type="search" placeholder="이름, 태그, 카테고리 검색" autofocus />
            <kbd>⌘ K</kbd>
          </div>
          <button id="rescanBtn" class="icon-button" title="폴더 다시 스캔">↻</button>
        </header>

        <section class="content-header">
          <div>
            <div class="eyebrow">LOCAL LIBRARY</div>
            <h1 id="viewTitle">모든 사운드</h1>
            <p id="resultSummary">0개의 사운드</p>
          </div>
          <div class="resolve-hint"><span class="pulse"></span>이름 선택 → 아래 파형에서 구간 편집</div>
        </section>

        <section class="sound-table-wrap">
          <div class="sound-table-head">
            <span></span><span>이름</span><span>파형</span><span>카테고리</span><span>길이</span><span>포맷</span><span>채널</span><span>태그</span><span></span>
          </div>
          <div id="soundList" class="sound-list"></div>
          <div id="emptyState" class="empty-state">
            <div class="empty-icon">♫</div>
            <h2>첫 사운드 라이브러리를 만들어보세요</h2>
            <p>폴더를 추가하면 내부의 오디오 파일을 자동으로 분류하고 검색할 수 있습니다.</p>
            <button id="emptyAddBtn" class="primary-button">사운드 폴더 선택</button>
          </div>
        </section>

        <section id="auditionPanel" class="audition-panel">
          <div class="audition-toolbar">
            <button id="detailPlayButton" class="detail-play" title="재생/정지 (Space)">▶</button>
            <div class="audition-title">
              <strong id="detailSoundName">목록에서 사운드 이름을 선택하세요</strong>
              <small>Space 재생 · 파형 드래그로 구간 선택 · 선택 영역을 Resolve로 드래그</small>
            </div>
            <button id="clearRangeButton" class="clear-range hidden">선택 해제</button>
            <time id="detailCurrentTime">0:00.00</time>
            <span class="time-divider">/</span>
            <time id="detailTotalTime">0:00.00</time>
          </div>
          <div id="detailWaveformWrap" class="detail-waveform-wrap">
            <canvas id="detailWaveformCanvas"></canvas>
            <div id="detailWaveformLoading" class="detail-waveform-loading">파형 생성 중…</div>
            <div id="detailSelection" class="detail-selection hidden" draggable="false" title="클릭: 구간 재생 · 드래그: 선택 구간 전달"><span></span></div>
            <div id="detailPlayhead" class="detail-playhead"></div>
          </div>
        </section>
      </main>

      <aside id="inspector" class="inspector hidden">
        <div class="inspector-top"><span>사운드 정보</span><button id="closeInspector">×</button></div>
        <div class="artwork"><div class="wave-bars" id="waveBars"></div><button id="largePlay">▶</button></div>
        <label>이름<input id="editTitle" /></label>
        <label>카테고리<input id="editCategory" list="categoryOptions" /></label>
        <datalist id="categoryOptions"></datalist>
        <label>태그<input id="editTags" placeholder="쉼표로 구분" /></label>
        <label>메모<textarea id="editNotes" rows="4"></textarea></label>
        <div class="facts" id="soundFacts"></div>
        <div class="inspector-actions">
          <button id="revealBtn" class="subtle-button">Finder에서 보기</button>
          <button id="removeBtn" class="danger-button">라이브러리에서 삭제</button>
        </div>
      </aside>
    </div>

    <div id="scanToast" class="toast hidden"></div>
    <audio id="audioPlayer"></audio>
    <script src="renderer.js"></script>
  </body>
</html>
